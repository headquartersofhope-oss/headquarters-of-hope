[build]
  command = "npm run build"
  publish = "dist"

# ─── Canonical redirects — fixes Google Soft 404 on /Home ───────────────────
# Google crawled /Home (capital H) which does not exist in React Router
# Redirect all case variations permanently to canonical lowercase routes

[[redirects]]
  from = "/Home"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/home"
  to = "/"
  status = 301
  force = true

# Redirect www to non-www (canonical domain)
[[redirects]]
  from = "https://www.headquartersofhope.org/*"
  to = "https://headquartersofhope.org/:splat"
  status = 301
  force = true

# SPA catch-all redirect — CRITICAL for React Router
# Must come AFTER all specific redirects above
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─── Security headers ────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
